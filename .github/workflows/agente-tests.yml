name: Testes do agente conversacional

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'agente_conversacional/**'
      - '.github/workflows/agente-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente_conversacional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Mantém o diretório de trabalho no sys.path, como no Uvicorn.
      - run: python -m pytest -q
