<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} &middot; Analises Grupo 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="icon-music" viewBox="0 0 24 24">
      <circle cx="7" cy="17" r="2.4"/><circle cx="16" cy="15" r="2.4"/>
      <path d="M9.4 17V6.5L18.4 4.5V13.5"/>
    </symbol>
    <symbol id="icon-check-badge" viewBox="0 0 24 24">
      <path d="M12 3l2.2 1.6 2.7-.2 1 2.5 2.3 1.4-.6 2.7.6 2.7-2.3 1.4-1 2.5-2.7-.2L12 19l-2.2-1.6-2.7.2-1-2.5-2.3-1.4.6-2.7-.6-2.7 2.3-1.4 1-2.5 2.7.2z"/>
      <path d="M9 12l2 2 4-4"/>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/>
      <circle cx="17" cy="9" r="2.4"/><path d="M15 19c.4-2.2 1.7-3.6 3.5-4"/>
    </symbol>
    <symbol id="icon-disc" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.4"/>
    </symbol>
    <symbol id="icon-layers" viewBox="0 0 24 24">
      <path d="M12 3l8.5 4.5L12 12 3.5 7.5z"/>
      <path d="M3.5 12.5L12 17l8.5-4.5"/>
      <path d="M3.5 17L12 21.5 20.5 17"/>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/><line x1="12" y1="8" x2="12" y2="13"/>
      <circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="M12 3.5l2.6 5.4 6 .8-4.3 4.1 1 5.9-5.3-2.8-5.3 2.8 1-5.9-4.3-4.1 6-.8z"/>
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/>
      <line x1="3.5" y1="12" x2="20.5" y2="12"/>
    </symbol>
    <symbol id="icon-trending-up" viewBox="0 0 24 24">
      <polyline points="3.5,16.5 9.5,10.5 13.5,14.5 20.5,7"/>
      <polyline points="15,7 20.5,7 20.5,12.5"/>
    </symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24">
      <path d="M7 4h10v3a5 5 0 0 1-10 0z"/>
      <path d="M7 5H4.5a2 2 0 0 0 0 4H7"/>
      <path d="M17 5h2.5a2 2 0 0 1 0 4H17"/>
      <line x1="12" y1="12" x2="12" y2="16"/>
      <path d="M8.5 20h7"/><line x1="12" y1="16" x2="12" y2="20"/>
    </symbol>
    <symbol id="icon-pie-chart" viewBox="0 0 24 24">
      <path d="M12 3.5v8.5h8.5a8.5 8.5 0 1 1-8.5-8.5z"/>
      <path d="M12 3.5A8.5 8.5 0 0 1 20.5 12"/>
    </symbol>
  </defs>
</svg>
<div class="site">
  <nav class="site-nav">
    <a class="site-nav-brand" href="index.html">Grupo 8 &middot; Analises</a>
    <button type="button" class="site-nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav-links" aria-label="Abrir menu de navegacao">
      <span></span><span></span><span></span>
    </button>
    <div class="site-nav-links" id="site-nav-links">
      <a class="site-nav-link" href="index.html">Inicio</a>
      {% for item in nav_items %}
      <a class="site-nav-link" href="{{ item.href }}">{{ item.nav }}</a>
      {% endfor %}
    </div>
  </nav>
  <script>
    (function () {
      var toggle = document.querySelector("[data-nav-toggle]");
      var links = document.getElementById("site-nav-links");
      if (!toggle || !links) return;
      toggle.addEventListener("click", function () {
        var open = links.classList.toggle("open");
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Gerado automaticamente a partir de <code>dataset.csv</code> &middot;
    <a href="https://github.com/Lucas-AV/Grupo-8-ResIA">repositorio</a>
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
