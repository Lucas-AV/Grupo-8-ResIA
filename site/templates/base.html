<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} &middot; Analises Grupo 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="site">
  <nav class="site-nav">
    <a class="site-nav-brand" href="index.html">Grupo 8 &middot; Analises</a>
    <button type="button" class="site-nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="site-nav-links" aria-label="Abrir menu de navegacao">
      <span></span><span></span><span></span>
    </button>
    <div class="site-nav-links" id="site-nav-links">
      <a class="site-nav-link" href="index.html">Inicio</a>
      {% for item in nav_items %}
      <a class="site-nav-link" href="{{ item.href }}">{{ item.nav }}</a>
      {% endfor %}
    </div>
  </nav>
  <script>
    (function () {
      var toggle = document.querySelector("[data-nav-toggle]");
      var links = document.getElementById("site-nav-links");
      if (!toggle || !links) return;
      toggle.addEventListener("click", function () {
        var open = links.classList.toggle("open");
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
      });
    })();
  </script>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Gerado automaticamente a partir de <code>dataset.csv</code> &middot;
    <a href="https://github.com/Lucas-AV/Grupo-8-ResIA">repositorio</a>
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
